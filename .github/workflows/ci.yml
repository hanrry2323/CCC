# CCC CI — GitHub Actions
# 2026-08-03 重构收口：旧 scripts/ 已退役归档，CI 切到新 server/ 栈。
# Jobs: pytest (server/), ruff (server/), shellcheck (server/deploy), swift-test (desktop)
# Triggers: push, PR

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (server/tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx requests
      - name: Run server tests
        run: pytest server/tests/ -v --tb=short

  card-validate:
    name: card validate (docs/dispatch 卡头门禁)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate task cards
        run: python -m server.board.validate docs/dispatch

  ruff:
    name: ruff (server/ lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.8.6"
          args: "check server/"

  shellcheck:
    name: shellcheck (server/deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shopt -s nullglob
          files=(server/deploy/*.sh)
          if [ ${#files[@]} -gt 0 ]; then shellcheck "${files[@]}"; else echo "no shell files"; fi

  swift-test:
    name: swift-test (desktop)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run desktop Swift tests
        run: cd desktop && swift test

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
  "desktop/",
  "vendor/",
  ".build/",
  "node_modules/",
]

[tool.ruff.lint]
# E/F/W = 基础 pycodestyle + pyflakes；I = isort；UP = pyupgrade
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",   # line too long（已 line-length=120 兜底，不强制拆行）
  "E701",   # multi-statement on one line（短 if ok）
  "E722",   # bare except（部分兜底路径需要）
  "E731",   # lambda assignment（部分排序 key 用 lambda）
  "E402",   # module-level import not at top（延迟 import 较多）
  "UP007",  # Optional[X] vs X | None — 保留旧风格兼容
  "UP017",  # timezone.utc vs datetime.UTC — 保留旧风格
  "UP035",  # typing.Iterator vs collections.abc — 保留旧风格
  "UP045",  # Optional[X] 同上
  "F401",   # unused import（部分模块为 side-effect 导入，**渐进收紧**：新代码应显式 `# noqa: F401`）
  "F841",   # unused variable（部分测试占位，**渐进收紧**：新代码不应新增）
  "I001",   # import sorting（现有大量模块未排序，**渐进收紧**：新模块应排序）
]

[tool.ruff.lint.per-file-ignores]
# 2026-07-24 方案 0.3：F401 渐进收紧
# - tests/scripts/* + tests/integration/* + scripts/tests/* ：测试文件历史包袱大，
#   继续 ignore F401/F841，新写测试不加 noqa
# - scripts/ccc-engine.py + ccc-board.py + board/roles/*.py：角色文件大量
#   `from X import a, b, c` 多导入但只用了 1-2 个，是历史风格累积，
#   不在本批范围；后续按文件单独清理
# - 其它 scripts/ 生产代码：从 ignore 移除 F401，开始清理
"tests/scripts/*" = ["F401", "F841", "E402", "I001"]
"tests/integration/*" = ["F401", "F841", "E402", "I001"]
"scripts/tests/*" = ["F401", "F841", "E402", "I001"]
"scripts/ccc-engine.py" = ["F401", "E402"]  # 角色文件未到 hot-path 前不动
"scripts/ccc-board.py" = ["F401"]
"scripts/board/roles/*.py" = ["F401"]
# 2026-07-24 方案 1.1：dispatch.py / failure_router.py 是新建骨架，
# 函数尚未从 ccc-engine.py 搬入；F401/F841 是预期的临时状态
"scripts/engine/dispatch.py" = ["F401", "F841"]
"scripts/engine/failure_router.py" = ["F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["_board_store", "_config", "_executor", "_failure_ledger", "_jsonl_rotate", "_utils", "_ccc_control", "_engine_wake", "_ops_probe", "_stats_aggregator", "_claude_cli"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests/scripts", "tests/cluster", "scripts/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-q",
  "--tb=short",
  "--strict-markers",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests requiring live subprocess",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.mypy]
explicit_package_bases = true
# 2026-07-24 方案 P0-2：mypy_path 让 mypy 能找到 _logger / _config / _utils 等
# 同仓脚本模块（mypy 从 repo root 跑时不会自动加 scripts/ 到 sys.path）
mypy_path = "scripts"
# 2026-07-24 方案 2.1：mypy strict 渐进启用
# 第 1-3 轮翻绿模块（2026-07-24）：_config.py / _utils.py / _jsonl_rotate.py
files = [
    "scripts/_config.py",
    "scripts/_utils.py",
    "scripts/_jsonl_rotate.py",
]
# 翻绿模块与已翻绿模块间有依赖，逐文件 strict 检查
strict = true
# 后续轮次按方案 2.1 表逆序推进：
# 第 4 轮 _board_store.py / 第 5 轮 engine/gates.py / 第 6 轮 engine/slots.py
# 第 7+ 轮 board/roles/*.py / 最后 ccc-engine.py

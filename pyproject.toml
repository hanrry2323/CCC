[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
  "desktop/",
  "vendor/",
  ".build/",
  "node_modules/",
]

[tool.ruff.lint]
# E/F/W = 基础 pycodestyle + pyflakes；I = isort；UP = pyupgrade
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",   # line too long（已 line-length=120 兜底，不强制拆行）
  "E701",   # multi-statement on one line（短 if ok）
  "E722",   # bare except（部分兜底路径需要）
  "E731",   # lambda assignment（部分排序 key 用 lambda）
  "E402",   # module-level import not at top（延迟 import 较多）
  "UP007",  # Optional[X] vs X | None — 保留旧风格兼容
  "UP017",  # timezone.utc vs datetime.UTC — 保留旧风格
  "UP035",  # typing.Iterator vs collections.abc — 保留旧风格
  # UP045 = 新版 ruff 对 Optional 的别名；CI 钉 ruff 0.8.6 不认识，勿写入 ignore
  "F841",   # unused variable（部分测试占位，**渐进收紧**：新代码不应新增）
  "I001",   # import sorting（现有大量模块未排序，**渐进收紧**：新模块应排序）
]

[tool.ruff.lint.per-file-ignores]
# 2026-08-02 重构定稿后：旧 scripts/ 已退役归档；只对 server/ 配置 per-file-ignores
# 测试文件可保留 F401/F841 宽松（fixture 占位、断言中间变量等）
"server/tests/*" = ["F401", "F841", "E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["server"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-q",
  "--tb=short",
  "--strict-markers",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests requiring live subprocess",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.mypy]
explicit_package_bases = true
# 2026-08-02 重构定稿后：mypy 走 server/ 包结构（含 __init__.py 的子包）
mypy_path = "server"
# 重构后 server/ 全量 strict 渐进启用
files = [
    "server/config/loader.py",
    "server/engine/dispatch.py",
    "server/engine/task.py",
]
strict = true
follow_imports = "silent"

# CCC pre-commit hooks
# 2026-08-03 重构收口：旧 scripts/ 已退役归档，pre-commit 切到新 server/ 栈。
#   - ruff (Python lint, server/)
#
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      # Python lint (if ruff installed — graceful skip if absent)
      - id: ruff
        name: ruff check (server/ lint)
        entry: ruff check server/
        language: system
        pass_filenames: false
        files: \.(py|pyi)$
        types: [file]

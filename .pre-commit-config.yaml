# CCC pre-commit hooks
# 2026-08-03 重构收口：旧 scripts/ 已退役归档，pre-commit 切到新 server/ 栈。
#   - ruff (Python lint, server/)
#
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      # Python lint (if ruff installed — graceful skip if absent)
      - id: ruff
        name: ruff check (server/ lint)
        entry: ruff check server/
        language: system
        pass_filenames: false
        files: \.(py|pyi)$
        types: [file]
      # 卡头门禁（T52）：任务卡字段/状态/编号唯一校验——docs/dispatch 改动即校验
      - id: card-validate
        name: validate task cards (docs/dispatch)
        entry: python -m server.board.validate docs/dispatch
        language: system
        pass_filenames: false
        files: ^docs/dispatch/
        types: [markdown]

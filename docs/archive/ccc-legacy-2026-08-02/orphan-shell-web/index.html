<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCC 看板</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">CCC 看板</div>
      <div id="status-badge" class="status-badge" aria-label="状态徽章"></div>
      <button id="theme-toggle" class="theme-toggle" title="切换主题" aria-label="切换主题">◐</button>
    </div>
  </header>

  <nav class="tabs" aria-label="视图切换">
    <button class="tab active" data-view="realtime">实时</button>
    <button class="tab" data-view="recent">7 天</button>
    <button class="tab" data-view="project">项目</button>
    <button class="tab" data-view="roadmap">线路图</button>
    <button class="tab" data-view="cluster">集群</button>
    <button class="tab" data-view="ops">运维</button>
    <button class="tab" data-view="chat">对话</button>
  </nav>

  <main class="content">
    <section id="view-realtime" class="view active" aria-label="实时视图"></section>
    <section id="view-recent" class="view" aria-label="7 天回写视图"></section>
    <section id="view-project" class="view" aria-label="项目视图"></section>
    <section id="view-roadmap" class="view" aria-label="线路图视图"></section>
    <section id="view-cluster" class="view" aria-label="集群状态视图"></section>
    <section id="view-ops" class="view" aria-label="运维视图"></section>
    <section id="view-chat" class="view" aria-label="对话视图">
      <div id="chat-card" class="chat-shell">
        <!-- 登录卡片（居中） -->
        <div id="login-area" class="chat-login">
          <div class="chat-login-card">
            <h2 class="chat-title">CCC 对话</h2>
            <p class="chat-login-sub">登录后可对话（走新服务端 /conversation，转发配置的模型上游）。</p>
            <div class="chat-form">
              <input id="login-user" type="text" placeholder="账号" class="chat-field" autocomplete="username" />
              <input id="login-pass" type="password" placeholder="密码" class="chat-field" autocomplete="current-password" />
              <button id="login-btn" class="chat-btn chat-btn-primary" type="button">登录</button>
            </div>
            <p id="login-msg" class="chat-form-msg"></p>
          </div>
        </div>

        <!-- 对话区（登录后显示） -->
        <div id="chat-area" class="chat-area" style="display:none">
          <div id="chat-welcome" class="chat-welcome">
            <h2 class="chat-title">有什么可以帮忙的？</h2>
            <p class="chat-welcome-sub">输入问题开始对话 · Enter 发送 · Shift+Enter 换行</p>
          </div>
          <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
          <div id="chat-composer" class="chat-composer">
            <p id="chat-msg" class="chat-composer-msg"></p>
            <div id="chat-attachments" class="chat-attachments"></div>
            <div class="chat-composer-row">
              <select id="chat-model" class="chat-select" title="模型档位（本地偏好）" aria-label="模型档位">
                <option value="flash">flash</option>
                <option value="Pro">Pro</option>
                <option value="code">code</option>
              </select>
              <button id="chat-attach" class="chat-icon-btn" type="button" title="附件（仅本地预览，服务端 /conversation 暂仅文本）" aria-label="附件">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M16.5 6v11.5a4 4 0 1 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 1 1-2 0V6h-1.5v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6z"/></svg>
              </button>
              <input id="chat-file-input" type="file" multiple style="display:none" />
              <textarea id="chat-input" class="chat-textarea" placeholder="问任何问题…" rows="1"></textarea>
              <button id="chat-send" class="chat-btn chat-btn-primary chat-send-btn" type="button">发送</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">静态看板 · 数据来自任务卡导出 · <span id="data-source">零 API</span></footer>

  <script>
    // 数据源推导（T23）：
    //   1. 显式 ?api= 参数优先（兼容旧用法）；
    //   2. 无参数且 location.protocol === "http:" → 同源 API（直开 7788 看页面）；
    //   3. file:// 零 API 模式（仅本地 board.js）。
    (function () {
      var m = location.search.match(/[?&]api=([^&]+)/);
      if (m) {
        window.API_BASE_URL = decodeURIComponent(m[1]);
      } else if (location.protocol === "http:" || location.protocol === "https:") {
        window.API_BASE_URL = location.origin;
      }
      if (window.API_BASE_URL) {
        console.log('[web] HTTP API 模式:', window.API_BASE_URL);
      }
      // token 统一管理（T23）：URL ?token= 注入时同步写入 localStorage，
      // app.js 与 chat.js 共用 ccc-chat-token 键读取
      var t = location.search.match(/[?&]token=([^&]+)/);
      if (t) {
        var tok = decodeURIComponent(t[1]);
        try { localStorage.setItem("ccc-chat-token", tok); } catch (e) {}
        window.BOARD_TOKEN = tok;
        console.log('[web] token 已注入');
      }
    })();
  </script>
  <script src="data/board.js"></script>
  <script src="data/cluster.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>

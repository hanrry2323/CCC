<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCC 看板</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">CCC 看板</div>
      <div id="status-badge" class="status-badge" aria-label="状态徽章"></div>
      <button id="theme-toggle" class="theme-toggle" title="切换主题" aria-label="切换主题">◐</button>
    </div>
  </header>

  <nav class="tabs" aria-label="视图切换">
    <button class="tab active" data-view="realtime">实时</button>
    <button class="tab" data-view="recent">7 天</button>
    <button class="tab" data-view="project">项目</button>
    <button class="tab" data-view="roadmap">线路图</button>
    <button class="tab" data-view="cluster">集群</button>
    <button class="tab" data-view="ops">运维</button>
    <button class="tab" data-view="chat">对话</button>
  </nav>

  <main class="content">
    <section id="view-realtime" class="view active" aria-label="实时视图"></section>
    <section id="view-recent" class="view" aria-label="7 天回写视图"></section>
    <section id="view-project" class="view" aria-label="项目视图"></section>
    <section id="view-roadmap" class="view" aria-label="线路图视图"></section>
    <section id="view-cluster" class="view" aria-label="集群状态视图"></section>
    <section id="view-ops" class="view" aria-label="运维视图"></section>
    <section id="view-chat" class="view" aria-label="对话视图">
      <div class="card" id="chat-card">
        <div id="login-area">
          <h3>登录对话</h3>
          <p class="meta">登录后可对话（走新服务端 /conversation，转发配置的模型上游）。</p>
          <div class="chip-row">
            <input id="login-user" type="text" placeholder="账号" class="chat-input" />
            <input id="login-pass" type="password" placeholder="密码" class="chat-input" />
            <button id="login-btn" class="hub-btn">登录</button>
          </div>
          <p id="login-msg" class="meta"></p>
        </div>
        <div id="chat-area" style="display:none">
          <h3>对话</h3>
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chip-row">
            <input id="chat-input" type="text" placeholder="输入消息…" class="chat-input chat-input-wide" />
            <button id="chat-send" class="hub-btn">发送</button>
          </div>
          <p id="chat-msg" class="meta"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">静态看板 · 数据来自任务卡导出 · <span id="data-source">零 API</span></footer>

  <script>
    // 数据源推导（T23）：
    //   1. 显式 ?api= 参数优先（兼容旧用法）；
    //   2. 无参数且 location.protocol === "http:" → 同源 API（直开 7788 看页面）；
    //   3. file:// 零 API 模式（仅本地 board.js）。
    (function () {
      var m = location.search.match(/[?&]api=([^&]+)/);
      if (m) {
        window.API_BASE_URL = decodeURIComponent(m[1]);
      } else if (location.protocol === "http:" || location.protocol === "https:") {
        window.API_BASE_URL = location.origin;
      }
      if (window.API_BASE_URL) {
        console.log('[web] HTTP API 模式:', window.API_BASE_URL);
      }
      // token 统一管理（T23）：URL ?token= 注入时同步写入 localStorage，
      // app.js 与 chat.js 共用 ccc-chat-token 键读取
      var t = location.search.match(/[?&]token=([^&]+)/);
      if (t) {
        var tok = decodeURIComponent(t[1]);
        try { localStorage.setItem("ccc-chat-token", tok); } catch (e) {}
        window.BOARD_TOKEN = tok;
        console.log('[web] token 已注入');
      }
    })();
  </script>
  <script src="data/board.js"></script>
  <script src="data/cluster.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
